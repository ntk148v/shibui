{{ define "main" }}
  <h1>Archive</h1>
  <div class="archive">
    {{- range (where site.RegularPages "Section" "posts").GroupByDate "2006" -}}
      <h2 class="archive-year">{{ .Key }}</h2>
      {{- range .Pages.GroupByDate "January" -}}
        <h3 class="archive-month">{{ .Key }}</h3>
        {{- range .Pages -}}
          <article class="archive-item">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02" }}</time>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </article>
        {{- end -}}
      {{- end -}}
    {{- end -}}
  </div>
{{ end }}
